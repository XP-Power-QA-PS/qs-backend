# ===================================================================
# Application Core Configuration
# ===================================================================
spring.application.name=qs-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===================================================================
# Database Configuration
# Sensitive credentials must NOT be exposed here.
# In dev: loaded from application-dev.properties (git-ignored)
# In prod: injected via environment variables (DB_URL, DB_USERNAME, DB_PASSWORD)
# ===================================================================
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=300000

# ===================================================================
# Flyway Migration Configuration
# Inherits datasource configuration by default
# ===================================================================
spring.flyway.url=${spring.datasource.url:}
spring.flyway.user=${spring.datasource.username:}
spring.flyway.password=${spring.datasource.password:}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.port=${PORT:8080}

# ===================================================================
# Redis Configuration
# ===================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=2000
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2

# ===================================================================
# Security & JWT Configuration
# In dev: loaded from application-dev.properties
# In prod: injected via JWT_SECRET
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ===================================================================
# Password Reset Configuration
# ===================================================================
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# ===================================================================
# Initial Admin Account Seed Configuration
# In dev: loaded from application-dev.properties
# In prod: injected via ADMIN_DEFAULT_* variables
# ===================================================================
app.admin.username=${ADMIN_DEFAULT_USERNAME}
app.admin.password=${ADMIN_DEFAULT_PASSWORD}
app.admin.email=${ADMIN_DEFAULT_EMAIL}

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

